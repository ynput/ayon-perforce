# WARNING: This file is used only for development done on this addon.
# Be aware that dependencies used here might not match the ones used by
# the specific addon bundle set up on the AYON server. This file should
# be used only for local development and CI/CD purposes.

[project]
name = "ayon-perforce"
version = "0.1.0+dev"
description = "AYON integration for Perforce"
authors = [
    {name = "Ynput s.r.o.", email = "team@ynput.io"}

]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}

dependencies = [
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "pytest ~= 8.0",
    "pytest-print ~= 1.0",
    "ruff ~= 0.15",
    "pre-commit",
    "codespell ~= 2.2.6",
    "mypy ~= 2.3.0",
    "semver ~= 3.0.2",
    "clique ~= 2.0",
    "pyblish-base ~= 1.8",
    "attrs ~= 24.2.0",
    "ayon-python-api ~= 1.0"
]

[tool.ruff]
preview = true

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "vendor",
    "generated",
]

# Same as Black.
line-length = 79
indent-width = 4


# Python of Unreal 5.4+
target-version = "py311"

[tool.ruff.lint]
preview = true
pydocstyle.convention = "google"
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["ALL"]
ignore = [
    "PTH",
    "missing-return-type-special-method",
    "missing-trailing-comma",
    "subprocess-without-shell-equals-true",
    "commented-out-code",
    "raise-vanilla-args",
    "unused-method-argument",
    "implicit-namespace-package",  # add `__init__.py` to namespaced package
    "line-contains-todo",  # FIX all TODOs
    "missing-todo-link",   # missing issue link
    "suspicious-subprocess-import",    # subprocess module is possibly insecure
    "import-outside-top-level", # import must be on top of the file
    "missing-copyright-notice",  # missing copyright header
    "undocumented-magic-method"  # undocumented magic method
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["assert", "magic-value-comparison"]  # allow asserts and magical values

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.codespell]
# Ignore words that are not in the dictionary.
ignore-words-list = "ayon,ynput,parms,parm,hda,developpement"

# Ignore lines that contain this regex. This is hack for missing inline ignore.
# Remove with next codespell release (>2.2.6)
ignore-regex = ".*codespell:ignore.*"

skip = "./.*,./package/*,*/vendor/*"
count = true
quiet-level = 3

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/client"
python_version = "3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
# live server tests run only when selected: `pytest -m live`
addopts = "-ra -q -m 'not live'"
markers = [
    "live: read-only tests against a real Perforce server, connection is read from `tests/.env` or the environment",
]

[tool.ty.environment]
extra-paths = [
    "../ayon-core/client",
    "../ayon-docker/backend",
    "../ayon-python-api"
]


[dependency-groups]
docs = [
    "mkdocs-material >= 9.6.7",
    "mkdocs-autoapi >= 0.4.0",
    "mkdocstrings-python >= 1.16.2",
    "mkdocs-minify-plugin >= 0.8.0",
    "markdown-checklist >= 0.4.4",
    "mdx-gh-links >= 0.4",
    "pymdown-extensions >= 10.14.3",
    "mike >= 2.1.3",
    "mkdocstrings-shell >= 1.0.2",
]
