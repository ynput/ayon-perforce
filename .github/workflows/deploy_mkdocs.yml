name: Deploy MkDocs

on:
  push:
    tags:
      - "*"
    branches:
      - "chore/add-mkdocs-api-docs"
  workflow_dispatch:

jobs:
  build-mk-docs:
    # FIXME: Update @develop to @main after `ops-repo-automation` release.
    uses: ynput/ops-repo-automation/.github/workflows/deploy_mkdocs.yml@feature/mkdocs-shared-setup
    with:
      repo: ${{ github.repository }}
      docs_setup_ref: feature/mkdocs-shared-setup
    secrets:
      YNPUT_BOT_TOKEN: ${{ secrets.YNPUT_BOT_TOKEN }}
      CI_USER: ${{ secrets.CI_USER }}
      CI_EMAIL: ${{ secrets.CI_EMAIL }}
